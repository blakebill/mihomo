# Merge MetaCubeX upstream into Meta, keep Smart, push.
# Push to Meta triggers Dart Core Release.
name: Sync upstream with Dart Smart

on:
  workflow_dispatch:
  schedule:
    - cron: "27 3 * * *"

permissions:
  contents: write

concurrency:
  group: dart-upstream-meta-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream Meta/Alpha
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout fork
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          ref: Meta

      - name: Configure repositories
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/MetaCubeX/mihomo.git 2>/dev/null || \
            git remote set-url upstream https://github.com/MetaCubeX/mihomo.git
          if git ls-remote --heads upstream Meta | grep -q refs/heads/Meta; then
            BRANCH=Meta
          else
            BRANCH=Alpha
          fi
          echo "UPSTREAM_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git fetch --no-tags upstream "$BRANCH"

      - name: Merge upstream
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "Already up to date with upstream/${UPSTREAM_BRANCH}."
          else
            git merge --no-ff "upstream/${UPSTREAM_BRANCH}" \
              -m "chore: sync upstream ${UPSTREAM_BRANCH}"
          fi

      - name: Verify Dart Smart registration hooks
        run: |
          set -euo pipefail
          test -f adapter/outboundgroup/smart.go
          test -d adapter/outboundgroup/smartengine
          grep -Fq 'case "smart":' adapter/outboundgroup/parser.go
          grep -E -q $'\tSmart$' constant/adapters.go || grep -Fq $'\tSmart' constant/adapters.go

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: "1.26"
          cache: true

      - name: Test Smart + smoke compile
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
          SKIP_INTEROP_TEST: "1"
        run: |
          set -euo pipefail
          go test ./adapter/outboundgroup/smartengine/... -count=1
          go test ./adapter/outboundgroup/ -run 'Smart' -count=1
          go test ./... -tags with_gvisor -run "^$" -count=0

      - name: Push Meta
        run: |
          set -euo pipefail
          git push origin HEAD:Meta
          # Pushing Meta triggers Dart Core Release.
