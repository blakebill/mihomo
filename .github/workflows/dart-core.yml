name: Dart Core

on:
  push:
    branches:
      - Meta
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Base version or complete Dart version (for example 1.19.29 or 1.19.29-dart.1)"
        required: false
        type: string

permissions: {}

concurrency:
  group: dart-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-amd64:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: "1.26"
          cache: true

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $base = $env:REQUESTED_VERSION.Trim().TrimStart('v')
          if (-not $base) {
            $base = (git describe --tags --match "v[0-9]*" --abbrev=0).Trim().TrimStart('v')
          }
          if ($base -match '-dart\.[0-9]+$') {
            $version = $base
          } else {
            $version = "$base-dart.${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Compile packages
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
          GOAMD64: v1
          GOTOOLCHAIN: local
        run: go test ./... -tags with_gvisor -run "^$" -count=0

      - name: Build Windows core
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
          GOAMD64: v1
          GOTOOLCHAIN: local
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $ldflags = "-X 'github.com/metacubex/mihomo/constant.Version=$env:VERSION' -X 'github.com/metacubex/mihomo/constant.BuildTime=$buildTime' -w -s -buildid="
          go build -tags with_gvisor -trimpath -ldflags $ldflags -o dist/mihomo.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and package
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $versionOutput = (& .\dist\mihomo.exe -v 2>&1 | Out-String).Trim()
          Write-Host $versionOutput
          if ($versionOutput -notmatch [regex]::Escape($env:VERSION)) {
            throw "Built core does not report version $env:VERSION"
          }
          $archive = "mihomo-windows-amd64-v$env:VERSION.zip"
          Compress-Archive -Path dist/mihomo.exe -DestinationPath "dist/$archive" -CompressionLevel Optimal
          $digest = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $archive" | Out-File dist/SHA256SUMS.txt -Encoding ascii
          $env:VERSION | Out-File dist/VERSION.txt -Encoding ascii -NoNewline
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload core artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dart-mihomo-windows-amd64
          path: |
            dist/mihomo-windows-amd64-*.zip
            dist/SHA256SUMS.txt
            dist/VERSION.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build-windows-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dart-mihomo-windows-amd64
          path: dist

      - name: Resolve release metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat dist/VERSION.txt)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Publish Dart Mihomo core
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mihomo ${{ env.VERSION }} for Dart
          target_commitish: ${{ github.sha }}
          prerelease: false
          generate_release_notes: true
          files: |
            dist/mihomo-windows-amd64-*.zip
            dist/SHA256SUMS.txt
