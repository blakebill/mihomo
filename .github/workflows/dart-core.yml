# Build the current stable-based Meta branch (includes Smart) and publish Windows.
name: Dart Core Release

on:
  push:
    branches:
      - Meta
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional full Dart version (e.g. 1.19.29-dart.4). Empty = auto."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dart-core-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify Dart Smart is present
        shell: pwsh
        run: |
          if (-not (Test-Path "adapter/outboundgroup/smart.go")) { throw "missing smart.go" }
          if (-not (Test-Path "adapter/outboundgroup/smartengine")) { throw "missing smartengine" }
          $adapters = Get-Content "constant/adapters.go" -Raw
          if ($adapters -notmatch '(?m)^\s*Smart\s*$') { throw "Smart type not registered" }
          $parser = Get-Content "adapter/outboundgroup/parser.go" -Raw
          if ($parser -notmatch 'case "smart":') { throw "parser missing case smart" }

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: "1.26"
          cache: true

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $req = ""
          if ($env:REQUESTED_VERSION) {
            $req = $env:REQUESTED_VERSION.Trim().TrimStart('v')
          }

          $stableCandidates = @()
          $reachableTags = @(git tag --merged HEAD --list "v*")
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to enumerate release tags reachable from HEAD"
          }
          foreach ($tagLine in $reachableTags) {
            $tag = $tagLine.Trim()
            if ($tag -match '^v((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))$') {
              $stableCandidates += [PSCustomObject]@{
                Tag = $tag
                Version = [version]$Matches[1]
              }
            }
          }
          if ($stableCandidates.Count -eq 0) {
            throw "HEAD is not based on a stable semantic-version release tag"
          }
          $stable = $stableCandidates |
            Sort-Object Version |
            Select-Object -Last 1
          $base = $stable.Tag.Substring(1)

          function Test-CompleteRelease {
            param(
              [Parameter(Mandatory = $true)][string]$ReleaseTag,
              [Parameter(Mandatory = $true)][string]$Version
            )

            $releaseJson = & gh api `
              "repos/$env:GITHUB_REPOSITORY/releases/tags/$ReleaseTag" 2>$null
            if ($LASTEXITCODE -ne 0) {
              return $false
            }
            try {
              $release = ($releaseJson -join "`n") | ConvertFrom-Json -Depth 10
            } catch {
              return $false
            }
            if ($release.draft -or $release.prerelease) {
              return $false
            }

            $archiveName = "mihomo-windows-amd64-v$Version.zip"
            $archive = @($release.assets | Where-Object { $_.name -eq $archiveName })[0]
            $checksums = @($release.assets | Where-Object { $_.name -eq "SHA256SUMS.txt" })[0]
            return (
              $null -ne $archive -and [int64]$archive.size -gt 0 -and
              $null -ne $checksums -and [int64]$checksums.size -gt 0
            )
          }

          if ($req) {
            if ($req -notmatch '^((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))-dart\.[1-9][0-9]*$') {
              throw "Requested version must look like 1.19.29-dart.4"
            }
            if ($Matches[1] -ne $base) {
              throw "Requested version base $($Matches[1]) does not match reachable stable $base"
            }
            $version = $req
            $existingCommit = & git rev-parse -q --verify "refs/tags/v$version^{commit}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $existingCommit = ($existingCommit | Select-Object -First 1).Trim()
              $headCommit = (git rev-parse HEAD).Trim()
              if ($existingCommit -ne $headCommit) {
                throw "Requested tag v$version already points at $existingCommit, not $headCommit"
              }
            } elseif ($LASTEXITCODE -ne 1) {
              throw "Unable to inspect requested tag v$version"
            }
            $shouldBuild = "true"
          } else {
            $existingTags = @(
              git tag --points-at HEAD --list "v$base-dart.*" |
                ForEach-Object {
                  if ($_ -match "^v$([regex]::Escape($base))-dart\.([1-9][0-9]*)$") {
                    [PSCustomObject]@{
                      Tag = $_
                      Sequence = [int64]$Matches[1]
                    }
                  }
                } |
                Sort-Object Sequence
            )
            if ($existingTags.Count -gt 0) {
              $version = $existingTags[-1].Tag.Trim().TrimStart('v')
              if (Test-CompleteRelease -ReleaseTag "v$version" -Version $version) {
                $shouldBuild = "false"
                Write-Host "Commit already has complete release v$version; skipping duplicate build."
              } else {
                # Reuse the existing tag/version so Publish can create the
                # missing release or replace incomplete assets with --clobber.
                $shouldBuild = "true"
                Write-Host "Release v$version is absent or incomplete; repairing publication."
              }
            } else {
              $version = "$base-dart.${{ github.run_number }}"
              $shouldBuild = "true"
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "stable_tag=$($stable.Tag)" >> $env:GITHUB_OUTPUT
          "should_build=$shouldBuild" >> $env:GITHUB_OUTPUT
          Write-Host "stable=$($stable.Tag) version=$version build=$shouldBuild sha=$(git rev-parse --short HEAD)"

      - name: Test Smart
        if: steps.version.outputs.should_build == 'true'
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
          SKIP_INTEROP_TEST: "1"
        run: |
          go test ./adapter/outboundgroup/smartengine/... -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./adapter/outboundgroup/ -run "Smart" -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile packages
        if: steps.version.outputs.should_build == 'true'
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
          GOAMD64: v1
          GOTOOLCHAIN: local
        run: go test ./... -tags with_gvisor -run "^$" -count=0

      - name: Build Windows core
        if: steps.version.outputs.should_build == 'true'
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
          GOAMD64: v1
          GOTOOLCHAIN: local
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $ldflags = "-X 'github.com/metacubex/mihomo/constant.Version=$env:VERSION' -X 'github.com/metacubex/mihomo/constant.BuildTime=$buildTime' -w -s -buildid="
          go build -tags with_gvisor -trimpath -ldflags $ldflags -o dist/mihomo.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and package
        if: steps.version.outputs.should_build == 'true'
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $versionOutput = (& .\dist\mihomo.exe -v 2>&1 | Out-String).Trim()
          Write-Host $versionOutput
          if ($versionOutput -notmatch [regex]::Escape($env:VERSION)) {
            throw "Built core does not report version $env:VERSION"
          }
          $archive = "mihomo-windows-amd64-v$env:VERSION.zip"
          Compress-Archive -Path dist/mihomo.exe -DestinationPath "dist/$archive" -CompressionLevel Optimal
          $digest = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $archive" | Out-File dist/SHA256SUMS.txt -Encoding ascii
          $env:VERSION | Out-File dist/VERSION.txt -Encoding ascii -NoNewline
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: steps.version.outputs.should_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          STABLE_TAG: ${{ steps.version.outputs.stable_tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          notes="Dart-maintained Windows amd64 mihomo (Meta) with Smart group, based on upstream stable $STABLE_TAG. Commit $(git rev-parse --short HEAD)."
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "dist/$ARCHIVE" \
              "dist/SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Mihomo $VERSION for Dart" --notes "$notes" \
              --draft=false --prerelease=false \
              --target "$(git rev-parse HEAD)"
          else
            gh release create "$RELEASE_TAG" \
              "dist/$ARCHIVE" \
              "dist/SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Mihomo $VERSION for Dart" \
              --notes "$notes" \
              --target "$(git rev-parse HEAD)"
          fi
